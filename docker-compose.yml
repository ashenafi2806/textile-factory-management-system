services:
  mysql:
    image: mysql:8.0
    container_name: tfms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: textile_factory
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: tfms_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data:
